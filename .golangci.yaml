version: 2

run:
  tests: false

linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    revive:
      max-open-files: 2048
      ignore-generated-header: true
      severity: error
      rules:
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#add-constant
        - name: add-constant
          severity: warning
          disabled: false
          arguments:
            - maxLitCount: "3"
              allowStrs: '""'
              allowInts: "0,1,2"
              allowFloats: "0.0,0.,1.0,1.,2.0,2."
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#argument-limit
        - name: argument-limit
          severity: warning
          disabled: false
          arguments: [4]
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#atomic
        - name: atomic
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#banned-characters
        - name: banned-characters
          severity: warning
          disabled: false
          arguments: ["Ω", "Σ", "σ", "7"]
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#blank-imports
        - name: blank-imports
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#bool-literal-in-expr
        - name: bool-literal-in-expr
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#cognitive-complexity
        - name: cognitive-complexity
          severity: warning
          disabled: false
          arguments: [60] #TBD
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#comment-spacings
        - name: comment-spacings
          severity: warning
          disabled: false
          arguments:
            - nosec
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#confusing-naming
        - name: confusing-naming
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#confusing-results
        - name: confusing-results
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#constant-logical-expr
        - name: constant-logical-expr
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#cyclomatic
        - name: cyclomatic
          severity: warning
          disabled: false
          arguments: [20] # TBD 10
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#datarace
        - name: datarace
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#deep-exit
        - name: deep-exit
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#defer
        - name: defer
          severity: warning
          disabled: false
          arguments:
            - ["call-chain", "loop"]
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#dot-imports
        - name: dot-imports
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#duplicated-imports
        - name: duplicated-imports
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#early-return
        - name: early-return
          severity: warning
          disabled: false
          arguments:
            - "preserveScope"
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#empty-block
        - name: empty-block
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#empty-lines
        - name: empty-lines
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#error-naming
        - name: error-naming
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#error-return
        - name: error-return
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#error-strings
        - name: error-strings
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#errorf
        - name: errorf
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#exported
        - name: exported
          severity: warning
          disabled: false
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#flag-parameter
        - name: flag-parameter
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#function-result-limit
        - name: function-result-limit
          severity: warning
          disabled: false
          arguments: [4]
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#function-length
        - name: function-length
          severity: warning
          disabled: false
          arguments: [75, 0]
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#get-return
        - name: get-return
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#identical-branches
        - name: identical-branches
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#if-return
        - name: if-return
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#increment-decrement
        - name: increment-decrement
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#indent-error-flow
        - name: indent-error-flow
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#import-shadowing
        - name: import-shadowing
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#line-length-limit
        - name: line-length-limit
          severity: warning
          disabled: false
          arguments: [150] #TBD 80
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#modifies-parameter
        - name: modifies-parameter
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#modifies-value-receiver
        - name: modifies-value-receiver
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#nested-structs
        - name: nested-structs
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#optimize-operands-order
        - name: optimize-operands-order
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#package-comments
        - name: package-comments
          severity: warning
          disabled: true
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#range
        - name: range
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#range-val-in-closure
        - name: range-val-in-closure
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#range-val-address
        - name: range-val-address
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#receiver-naming
        - name: receiver-naming
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#redefines-builtin-id
        - name: redefines-builtin-id
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#string-of-int
        - name: string-of-int
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#superfluous-else
        - name: superfluous-else
          severity: warning
          disabled: false
          arguments:
            - "preserveScope"
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#time-equal
        - name: time-equal
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#time-naming
        - name: time-naming
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#var-naming
        - name: var-naming
          severity: warning
          disabled: false
          arguments:
            - ["ID"] # AllowList
            - ["VM"] # DenyList
            - - upperCaseConst: true # https://github.com/golang/lint/issues/89
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#var-declaration
        - name: var-declaration
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unconditional-recursion
        - name: unconditional-recursion
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unexported-naming
        - name: unexported-naming
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unexported-return
        - name: unexported-return
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unhandled-error
        - name: unhandled-error
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unnecessary-stmt
        - name: unnecessary-stmt
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unreachable-code
        - name: unreachable-code
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unused-parameter
        - name: unused-parameter
          severity: warning
          disabled: false
          arguments:
            - allowRegex: "^_"
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#unused-receiver
        - name: unused-receiver
          severity: warning
          disabled: false
          arguments:
            - allowRegex: "^_"
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#useless-break
        - name: useless-break
          severity: warning
          disabled: false
        # https://github.com/mgechev/revive/blob/[main]/RULES_DESCRIPTIONS.md#waitgroup-by-value
        - name: waitgroup-by-value
          severity: warning
          disabled: false
  enable:
    - revive
    - gosec
    - errorlint
  exclusions:
    generated: lax
    paths:
      - "redfish/provider/data_source_redfish_system_boot.go"

formatters:
  enable:
    - gofmt
    - gofumpt

output:
  sort-order:
    - file